<style>
:root{--bg:#fff;--ink:#1a1a1a;--card:#fff;--line:#e8e8e8;--mut:#555;--green:#1f8a2e;--orange:#e8730c;--soft:#fff3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--ink:#f3f3f3;--card:#212427;--line:#33373b;--mut:#b5b9bd;--soft:#3a2c1c}}
:root[data-theme="dark"]{--bg:#16181a;--ink:#f3f3f3;--card:#212427;--line:#33373b;--mut:#b5b9bd;--soft:#3a2c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 150px}
h1{font-size:clamp(1.5rem,6.5vw,2.1rem);line-height:1.35;margin:22px 0 18px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1.15;width:100%;object-fit:cover;display:block}
.tile{aspect-ratio:1.15;display:grid;place-items:center;font-size:3.5rem;background:var(--soft)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.row b{font-size:1.05rem}
.pr{color:var(--orange);font-weight:800;white-space:nowrap;font-size:.98rem}
.body p{margin:4px 0 10px;color:var(--mut);font-size:.88rem;flex:1}
.add{border:0;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:10px;border-radius:9px;cursor:pointer}
.qty{display:none;align-items:center;justify-content:space-between;background:var(--green);color:#fff;border-radius:9px;padding:3px}
.qty button{width:34px;height:34px;border:0;border-radius:7px;background:#fff;color:var(--green);font-size:1.3rem;font-weight:800;cursor:pointer}
.qty span{font-weight:800}
.card.in .add{display:none}.card.in .qty{display:flex}
.foot{margin:24px 0 0;font-weight:800;font-size:1.02rem}
.fab{position:fixed;inset-inline-start:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start;z-index:5}
.fab a,.fab button{display:flex;align-items:center;gap:8px;border:0;font:inherit;cursor:pointer;text-decoration:none;color:var(--ink);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-weight:500;font-size:.92rem}
.fab i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.3rem;color:#fff}
.i-wa{background:#25d366}.i-fd{background:var(--orange)}.i-cart{background:var(--green);position:relative}
.i-cart em{position:absolute;top:-4px;inset-inline-end:-4px;background:#d92d20;color:#fff;font-style:normal;font-size:.72rem;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;font-weight:800}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none}
.shade.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;font-size:1.3rem;display:flex;justify-content:space-between}
.sheet h2 button{border:0;background:none;color:var(--ink);font-size:1.6rem;cursor:pointer}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin:10px 0 0}
label{display:block;font-weight:500;margin:10px 0 3px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.act button,.act a{flex:1;min-width:140px;text-align:center;padding:13px;border-radius:10px;border:0;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;color:#fff}
.wa{background:#25d366}.cp{background:var(--orange)}
#msg{margin-top:8px;min-height:1.4em;font-weight:500}
</style>

var q=items.map(function(){return 0});
var grid=document.getElementById("grid");
items.forEach(function(it,i){
 var c=document.createElement("div");c.className="card";
 c.innerHTML=(it.img?'<img class="ph" alt="'+it.n+'" src="'+it.img+'">':'<div class="tile">'+it.e+'</div>')+
 '<div class="body"><div class="row"><b>'+it.n+'</b><span class="pr">'+it.p+' دج</span></div><p>'+it.d+'</p>'+
 '<button type="button" class="add">أضف للسلة</button><div class="qty"><button type="button" aria-label="زد">+</button><span>1</span><button type="button" aria-label="نقص">−</button></div></div>';
 c._s=c.querySelector("span");
 c.querySelector(".add").onclick=function(){set(i,1)};
 var b=c.querySelectorAll(".qty button");
 b[0].onclick=function(){set(i,q[i]+1)};b[1].onclick=function(){set(i,q[i]-1)};
 grid.appendChild(c);it.el=c;
});
function set(i,v){q[i]=Math.max(0,v);var c=items[i].el;c.classList.toggle("in",q[i]>0);c._s.textContent=q[i];upd()}
function tot(){return items.reduce(function(a,it,i){return a+it.p*q[i]},0)}
function cnt(){return q.reduce(function(a,b){return a+b},0)}
function build(){
 var l=["السلام عليكم، أريد أن أطلب:"];
 items.forEach(function(it,i){if(q[i])l.push("- "+it.n+" × "+q[i]+" = "+it.p*q[i]+" دج")});
 l.push("المجموع: "+tot()+" دج (بدون التوصيل)");
 [["name","الاسم"],["phone","الهاتف"],["addr","مكان التوصيل"],["day","الوقت"],["note","ملاحظات"]].forEach(function(f){var v=document.getElementById(f[0]).value.trim();if(v)l.push(f[1]+": "+v)});
 return l.join("\n");
}
function upd(){
 document.getElementById("cnt").textContent=cnt();document.getElementById("tot").textContent=tot()+" دج";
 document.getElementById("lines").innerHTML=cnt()?items.map(function(it,i){return q[i]?'<div class="ln"><span>'+it.n+' × '+q[i]+'</span><span>'+it.p*q[i]+' دج</span></div>':""}).join(""):'<p>السلة فارغة. أضف طبقا من القائمة.</p>';
 var u="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(build());
 document.getElementById("waSend").href=u;
 document.getElementById("waTop").href="https://wa.me/"+WA_NUMBER;
}
["name","phone","addr","day","note"].forEach(function(id){document.getElementById(id).oninput=upd});
var sh=document.getElementById("shade");
document.getElementById("cartBtn").onclick=function(){upd();sh.classList.add("on")};
document.getElementById("close").onclick=function(){sh.classList.remove("on")};
sh.onclick=function(e){if(e.target===sh)sh.classList.remove("on")};
document.getElementById("copy").onclick=function(){
 var t=build(),m=document.getElementById("msg");
 function ok(){m.textContent="تم نسخ الرسالة."}
 function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(x){m.textContent="تعذر النسخ."}a.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else{fb()}
};
upd();
